name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fd-find fzf jq qalc
          if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi

      - name: Validate manifest
        run: bash tests/manifest-test.sh

      - name: Run model tests
        run: node tests/menu-model-test.js

      - name: Run QML extension path tests
        run: node tests/qml-extension-path-test.js

      - name: Run Quickshell live-query process harness when available
        run: bash tests/live-query-process-integration-test.sh

      - name: Run extension loader tests
        run: python tests/extension-loader-test.py

      - name: Compile Python helpers
        run: python -m py_compile libexec/load-extensions.py extensions/files/file-index.py extensions/timezone/convert-timezone.py

      - name: Run qalc integration tests
        run: bash tests/qalc-integration-test.sh

      - name: Run timezone integration tests
        run: bash tests/timezone-integration-test.sh

      - name: Run file index integration tests
        run: python tests/file-index-integration-test.py
